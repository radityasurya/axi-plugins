name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # A malformed marketplace.json breaks `/plugin marketplace add` for
      # everyone who has this marketplace registered, so it is checked on
      # every push alongside the TOON emitter's quoting rules.
      - run: npm test
